name: Profile stats

on:
  schedule:
    # 00:30 MYT — after the day has rolled over locally, so the streak is current.
    - cron: '30 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gen-stats.mjs'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stat SVGs
        env:
          # GITHUB_TOKEN is enough: most of this account's contributions are to
          # private repos, but "Include private contributions on my profile" is
          # enabled, which makes the counts readable without a PAT. Set a
          # PROFILE_TOKEN secret (read:user) only if that setting is turned off.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs Luqidrari assets

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --staged --quiet || git commit -m 'chore: refresh profile stats'
          git push
