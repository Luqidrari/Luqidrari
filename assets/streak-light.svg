<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contribution streak for Luqidrari">
  <title>Luqidrari — 90 contributions, 0 day current streak, 2 day longest streak</title>
  <rect width="495" height="195" rx="6" fill="none"/>
  <line x1="165" y1="35" x2="165" y2="160" stroke="#e4e2e2" stroke-width="1"/>
  <line x1="330" y1="35" x2="330" y2="160" stroke="#e4e2e2" stroke-width="1"/>

    <g transform="translate(82.5, 48)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
      <text x="0" y="0" text-anchor="middle" fill="#151515" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="28">90</text>
      <text x="0" y="28" text-anchor="middle" fill="#464646" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="500" font-size="14">Total Contributions</text>
      <text x="0" y="52" text-anchor="middle" fill="#464646" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12">Sep 1, 2024 - Aug 29, 2026</text>
    </g>

    <g transform="translate(412.5, 48)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <text x="0" y="0" text-anchor="middle" fill="#151515" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="28">2</text>
      <text x="0" y="28" text-anchor="middle" fill="#464646" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="500" font-size="14">Longest Streak</text>
      <text x="0" y="52" text-anchor="middle" fill="#464646" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12">Sep 1 - Sep 2, 2024</text>
    </g>

  <g transform="translate(247.5, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <circle cx="0" cy="68" r="40" fill="none" stroke="#fb8c00" stroke-width="5"/>
    <text x="0" y="78" text-anchor="middle" fill="#151515" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="28">0</text>
    <text x="0" y="135" text-anchor="middle" fill="#fb8c00" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="14">Current Streak</text>
    <text x="0" y="156" text-anchor="middle" fill="#464646" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12">—</text>
    <g transform="translate(0, 28) scale(0.5)" fill="#fb8c00">
      <path d="M -12 -0.5 C -12 -8 -6 -12 -6 -18 C -6 -22 -3 -26 0 -28 C 0 -22 4 -19 7 -15 C 10 -11 12 -6 12 -0.5 C 12 6 5 12 0 12 C -5 12 -12 6 -12 -0.5 Z"/>
